name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:

jobs:
  lint-pr:
    if: github.event_name == 'pull_request'
    uses: nickdemianchuk/actions/.github/workflows/lint-pr.yml@0.3.3

  lint-commits:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: nickdemianchuk/actions/.github/workflows/lint-commits.yml@0.3.3
